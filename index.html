<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Equipment Dashboard – J.2505</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2235; --border: #1f2d47;
    --accent: #3b82f6; --accent2: #06b6d4; --accent3: #8b5cf6;
    --gold: #f59e0b; --green: #10b981; --red: #ef4444;
    --text: #f1f5f9; --muted: #64748b; --muted2: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px), linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);
    background-size:48px 48px;
  }
  .wrapper { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:32px 24px 80px; }

  /* LOADING */
  .loading-screen {
    position:fixed; inset:0; background:var(--bg); z-index:999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  }
  .spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading-text { font-family:'Syne',sans-serif; font-size:14px; color:var(--muted2); letter-spacing:2px; text-transform:uppercase; }
  .loading-screen.hidden { display:none; }

  /* HEADER */
  header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:40px; gap:24px; flex-wrap:wrap; }
  .header-left h1 {
    font-family:'Syne',sans-serif; font-size:clamp(24px,4vw,42px); font-weight:800;
    line-height:1.1; letter-spacing:-1px;
    background:linear-gradient(135deg,#fff 0%,var(--accent2) 60%,var(--accent3) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header-left .sub { font-size:13px; color:var(--muted2); margin-top:8px; letter-spacing:.5px; text-transform:uppercase; font-weight:500; }
  .header-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .badge {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(16,185,129,.12); border:1px solid rgba(16,185,129,.25);
    color:var(--green); padding:6px 14px; border-radius:99px; font-size:12px; font-weight:500;
  }
  .badge::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .last-update { font-size:11px; color:var(--muted); }
  .refresh-btn {
    background:var(--surface); border:1px solid var(--border); color:var(--muted2);
    padding:8px 16px; border-radius:10px; font-size:12px; cursor:pointer;
    font-family:'DM Sans',sans-serif; transition:all .15s; display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
  .refresh-btn svg { transition:transform .3s; }
  .refresh-btn.spinning svg { animation:spin .8s linear infinite; }

  /* SECTION TITLE */
  .section-title {
    font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
    text-transform:uppercase; letter-spacing:2px; color:var(--muted2);
    margin-bottom:16px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  /* FILTER TABS */
  .filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .filter-btn {
    background:var(--surface); border:1px solid var(--border); color:var(--muted2);
    padding:7px 16px; border-radius:99px; font-size:12px; font-weight:500;
    cursor:pointer; transition:all .15s; font-family:'DM Sans',sans-serif; white-space:nowrap;
  }
  .filter-btn:hover, .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* TABLE */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-bottom:48px; animation:fadeUp .6s ease both; }
  .table-header { padding:20px 24px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .table-header h2 { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; }
  .search-box { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 14px; }
  .search-box input { background:none; border:none; outline:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; width:160px; }
  .search-box input::placeholder { color:var(--muted); }

  .scroll-x { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:700px; }
  thead th {
    background:var(--surface2); padding:12px 14px; text-align:center;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted2); white-space:nowrap; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:2;
  }
  thead th:first-child { text-align:left; padding-left:24px; }
  tbody tr { border-bottom:1px solid rgba(31,45,71,.5); transition:background .15s; animation:fadeUp .4s ease both; }
  tbody tr:hover { background:rgba(59,130,246,.05); }
  tbody tr:last-child { border-bottom:none; }
  td { padding:13px 14px; text-align:center; font-size:13px; color:var(--muted2); }
  td:first-child { text-align:left; padding-left:24px; font-weight:600; color:var(--text); font-size:13.5px; white-space:nowrap; }
  .cell-val { display:inline-flex; align-items:center; justify-content:center; width:32px; height:28px; border-radius:8px; font-weight:700; font-size:13px; }
  .cell-val.has { background:rgba(59,130,246,.15); color:var(--accent); }
  .cell-val.zero { color:var(--border); }
  .total-cell { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; color:var(--text); }
  tfoot tr { background:rgba(59,130,246,.06) !important; border-top:2px solid var(--border); }
  tfoot td { font-weight:700; color:var(--accent2) !important; font-size:13px; }
  tfoot td:first-child { font-family:'Syne',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  tr.hidden { display:none; }

  .error-box { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; padding:16px 20px; border-radius:12px; font-size:13px; margin-bottom:24px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--surface); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Loading from Google Sheets…</div>
</div>

<div class="wrapper">
  <header>
    <div class="header-left">
      <h1>Survey Equipment<br>Dashboard</h1>
      <div class="sub">J.2505 &nbsp;·&nbsp; สรุปเครื่องมือสำรวจ</div>
    </div>
    <div class="header-right">
      <div class="badge">Live – Google Sheets</div>
      <div class="last-update" id="lastUpdate">Loading…</div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <div id="errorBox" class="error-box" style="display:none"></div>
  <div class="section-title">👤 Breakdown by Employee</div>
  <div class="filter-row" id="filterRow"></div>

  <div class="table-wrap">
    <div class="table-header">
      <h2 id="tableTitle">All Employees</h2>
      <div class="search-box" id="searchWrap">
        <svg width="14" height="14" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Search employee…" id="searchInput" oninput="filterTable()">
      </div>
    </div>
    <div class="scroll-x">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SHEET_ID = '1m7s0JDQIPmouRrFZRE2a4Dcc_XVW-LsJKUrgzkkdKUY';

// Tool sheet names — เพิ่ม/ลบตามชื่อ Sheet จริงใน Google Sheets
const TOOL_SHEETS = [
  'TOTAL STATION', 'AUTOMATIC LEVEL', 'Single Prism Set', 'Mini Prism',
  'Aluminium Tripod', 'Measure Tape (5m.)', 'Measure Tape (10m.)', 'Measure Tape (50m.)',
  'Safety harness', 'Calculator', 'Umbrella', 'GPS', 'Walkie Talkie',
  'Total Station Battery', 'USB'
];

// ── STATE ───────────────────────────────────────────────────
let state = { dashboard: null, details: {}, activeFilter: 'all' };

// ── JSONP via gviz/tq (ไม่มี CORS) ──────────────────────────
let _cbId = 0;
function fetchSheet(sheetName) {
  return new Promise((resolve, reject) => {
    const cbName = `_gvizCb${_cbId++}`;
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
      + `?tqx=out:json;responseHandler:${cbName}`
      + `&sheet=${encodeURIComponent(sheetName)}`;

    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup(); reject(new Error(`Timeout loading "${sheetName}"`));
    }, 15000);

    window[cbName] = (data) => {
      cleanup();
      // gviz returns table with cols + rows
      const cols = data.table.cols.map(c => c.label || '');
      const rows = (data.table.rows || []).map(r =>
        (r.c || []).map(cell => (cell && cell.v !== null && cell.v !== undefined) ? cell.v : '')
      );
      resolve({ cols, rows });
    };

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    script.onerror = () => { cleanup(); reject(new Error(`Cannot load "${sheetName}"`)); };
    script.src = url;
    document.head.appendChild(script);
  });
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = '❌ ' + msg;
}
function hideError() { document.getElementById('errorBox').style.display = 'none'; }

// ── LOAD DASHBOARD ───────────────────────────────────────────
async function loadDashboard() {
  const { cols, rows } = await fetchSheet('Dashboard');

  // cols[0] = Employee, cols[1..n] = tool names, last = Total
  // Skip first col (employee) and last col (total)
  const headers = cols.slice(1, cols.length - 1).filter(h => h.trim());

  const employees = [];
  for (const row of rows) {
    const name = String(row[0] || '').trim();
    if (!name || name.startsWith('รวม')) break;
    const vals = headers.map((_, i) => Number(row[i + 1]) || 0);
    employees.push({ name, vals });
  }

  const totalRow = rows.find(r => String(r[0] || '').startsWith('รวมทั้งหมด')) || [];
  const totals = headers.map((_, i) => Number(totalRow[i + 1]) || 0);

  return { headers, employees, totals };
}

// ── LOAD TOOL DETAIL ─────────────────────────────────────────
async function loadToolDetail(sheetName) {
  const { rows } = await fetchSheet(sheetName);
  const result = [];

  // gviz returns data rows only (no title/header rows) — row 0 = first data row
  // Our sheets: row 0=title, 1=note, 2=header, 3+=data → skip first 3
  const dataRows = rows.slice(3);

  for (const row of dataRows) {
    const no     = String(row[0] || '').trim();
    const type   = String(row[1] || '').trim();
    const brand  = String(row[2] || '').trim();
    const model  = String(row[3] || '').trim();
    const serial = String(row[4] || '').trim();
    const user   = String(row[5] || '').trim();
    const amt    = row[6];
    const remark = String(row[7] || '').trim();

    if (!user && !no) continue;
    result.push({
      no, type, brand, model, serial, user,
      amount: (amt !== '' && amt !== null) ? Number(amt) : '',
      remark
    });
  }
  return result;
}

// ── MAIN LOAD ────────────────────────────────────────────────
async function loadAll() {
  document.getElementById('loadingScreen').classList.remove('hidden');
  document.getElementById('refreshBtn').classList.add('spinning');
  hideError();

  try {
    const [dashboard, ...detailResults] = await Promise.all([
      loadDashboard(),
      ...TOOL_SHEETS.map(n => loadToolDetail(n).catch(() => []))
    ]);

    state.dashboard = dashboard;
    TOOL_SHEETS.forEach((name, i) => { state.details[name] = detailResults[i]; });

    document.getElementById('lastUpdate').textContent =
      'Updated: ' + new Date().toLocaleTimeString('th-TH');

    buildFilterRow();
    renderSummaryTable();

  } catch (err) {
    showError('โหลดข้อมูลไม่สำเร็จ: ' + err.message);
    console.error(err);
  } finally {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('refreshBtn').classList.remove('spinning');
  }
}

// ── BUILD FILTER TABS ────────────────────────────────────────
function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML =
    `<button class="filter-btn active" data-sheet="all">All</button>` +
    TOOL_SHEETS.map(n =>
      `<button class="filter-btn" data-sheet="${n.replace(/"/g,'&quot;')}">${n}</button>`
    ).join('');
  row.onclick = e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    setFilter(btn.dataset.sheet, btn);
  };
}

// ── BUILD FILTER TABS ────────────────────────────────────────
function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML =
    `<button class="filter-btn active" data-sheet="all">All</button>` +
    state.sheetNames.map(n =>
      `<button class="filter-btn" data-sheet="${n.replace(/"/g,'&quot;')}">${n}</button>`
    ).join('');

  // Attach click listeners via event delegation
  row.onclick = function(e) {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    setFilter(btn.dataset.sheet, btn);
  };
}

function setFilter(f, btn) {
  state.activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (f === 'all') renderSummaryTable();
  else renderDetailTable(f);
}

// ── SUMMARY TABLE ────────────────────────────────────────────
function renderSummaryTable() {
  const { headers, employees, totals } = state.dashboard;
  document.getElementById('tableTitle').textContent = 'All Employees';
  document.getElementById('searchWrap').style.display = '';
  document.getElementById('searchInput').value = '';

  document.getElementById('tableHead').innerHTML = `<tr>
    <th style="text-align:left;padding-left:24px">Employee</th>
    ${headers.map(h => `<th>${h}</th>`).join('')}
    <th>Total</th>
  </tr>`;

  document.getElementById('tableBody').innerHTML = employees.map((emp, i) => {
    const total = emp.vals.reduce((a,b)=>a+b,0);
    return `<tr data-name="${emp.name.toLowerCase()}" style="animation-delay:${i*.04}s">
      <td>${emp.name}</td>
      ${emp.vals.map(v=>`<td><span class="cell-val ${v>0?'has':'zero'}">${v>0?v:'—'}</span></td>`).join('')}
      <td class="total-cell">${total}</td>
    </tr>`;
  }).join('');

  const grand = employees.reduce((s,e)=>s+e.vals.reduce((a,b)=>a+b,0),0);
  document.getElementById('tableFoot').innerHTML = `<tr>
    <td>TOTAL</td>
    ${totals.map(t=>`<td style="font-family:'Syne',sans-serif;font-size:14px">${t}</td>`).join('')}
    <td style="font-family:'Syne',sans-serif;font-size:16px;color:var(--accent)">${grand}</td>
  </tr>`;
}

// ── DETAIL TABLE ─────────────────────────────────────────────
function renderDetailTable(sheetName) {
  const rows = state.details[sheetName] || [];
  document.getElementById('tableTitle').textContent = sheetName + ' — Detail';
  document.getElementById('searchWrap').style.display = 'none';

  document.getElementById('tableHead').innerHTML = `<tr>
    <th style="text-align:left;padding-left:24px">No.</th>
    <th style="text-align:left">TYPE</th>
    <th>Brand</th><th>Model</th>
    <th>Serial No.</th><th>USER</th>
    <th>Amount</th>
    <th style="text-align:left">REMARK</th>
  </tr>`;

  let total = 0;
  document.getElementById('tableBody').innerHTML = rows.map((r,i) => {
    const amt = r.amount;
    if (typeof amt === 'number' && amt > 0) total += amt;
    const amtHTML = amt === '' ? `<span class="cell-val zero">—</span>`
      : amt === 0 ? `<span class="cell-val zero">0</span>`
      : `<span class="cell-val has">${amt}</span>`;
    return `<tr style="animation-delay:${i*.03}s">
      <td style="text-align:left;padding-left:24px;color:var(--muted2)">${r.no}</td>
      <td style="text-align:left;font-weight:600;color:var(--text)">${r.type||'—'}</td>
      <td>${r.brand||'—'}</td>
      <td>${r.model||'—'}</td>
      <td style="font-family:monospace;font-size:12px;color:var(--accent2)">${r.serial||'—'}</td>
      <td style="font-weight:600;color:var(--text)">${r.user||'—'}</td>
      <td>${amtHTML}</td>
      <td style="text-align:left">${r.remark?`<span style="color:var(--gold);font-size:11px">${r.remark}</span>`:''}</td>
    </tr>`;
  }).join('');

  document.getElementById('tableFoot').innerHTML = `<tr>
    <td colspan="6" style="text-align:right;padding-right:16px">TOTAL OUT</td>
    <td style="font-family:'Syne',sans-serif;font-size:15px;color:var(--accent)">${total}</td>
    <td></td>
  </tr>`;
}

// ── SEARCH ───────────────────────────────────────────────────
function filterTable() {
  if (state.activeFilter !== 'all') return;
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#tableBody tr').forEach(row => {
    row.classList.toggle('hidden', !(row.dataset.name||'').includes(q));
  });
}

// ── START ────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
